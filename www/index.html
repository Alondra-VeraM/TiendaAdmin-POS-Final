<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lector POS</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-top: calc(12px + var(--safe-top));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* SOLO DOS BOTONES PRINCIPALES */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tab-btn {
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 700;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--muted);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .tab-btn svg {
      width: 20px;
      height: 20px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* VISOR DE CÁMARA */
    .camera-box {
      position: relative;
      width: 100%;
      height: 250px;
      border-radius: 14px;
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .laser {
      position: absolute;
      top: 15%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      pointer-events: none;
      animation: scan 2s infinite ease-in-out;
    }

    @keyframes scan {
      0% { top: 15%; }
      50% { top: 85%; }
      100% { top: 15%; }
    }

    /* BARRA INFERIOR DE CÁMARA (LINTERNA / CÓDIGO MANUAL) */
    .camera-bar {
      display: flex;
      gap: 8px;
    }

    .input-code {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      outline: none;
    }

    .input-code:focus {
      border-color: var(--primary);
    }

    .btn-action {
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-torch {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
    }

    /* CARD DE RESULTADO DEL ESCANEO */
    .result-card {
      display: none;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .result-card.success-border {
      border-color: #10b981;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 6px;
    }

    .api-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .prod-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .prod-code {
      font-size: 13px;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 4px;
      font-family: monospace;
    }

    .prod-meta-info {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .price-tag {
      font-size: 14px;
      font-weight: 800;
      color: #059669;
      margin-bottom: 8px;
    }

    .status-pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: #dcfce7;
      color: #15803d;
    }

    /* SECCIÓN INVENTARIO EN EL RESULT CARD */
    .inv-fields {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    .inv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .edit-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .edit-field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .edit-input {
      padding: 11px 12px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #fff;
      width: 100%;
    }

    .edit-input:focus {
      border-color: var(--primary);
    }

    .edit-two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .inv-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-display {
      width: 60px;
      height: 40px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      border: 2px solid var(--primary);
      border-radius: 8px;
      outline: none;
    }

    .btn-save-inv {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      background: var(--success);
      color: #fff;
      cursor: pointer;
      margin-top: 6px;
    }

    /* ESTADO DE CONEXIÓN CON EL POS */
    .lan-info {
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .lan-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 4px;
    }

    .lan-dot.off {
      background: #f59e0b;
    }
  </style>
</head>
<body>

  <div class="app">

    <!-- SOLAMENTE DOS OPCIONES: COBRAR O AGREGAR AL INVENTARIO -->
    <div class="tabs">
      <button id="tabCobrar" class="tab-btn active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>Cobrar</span>
      </button>

      <button id="tabInventario" class="tab-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>Agregar al Inventario</span>
      </button>
    </div>

    <!-- CÁMARA LECTORA CONTINUA -->
    <div class="camera-box">
      <div id="reader"></div>
      <div class="laser"></div>
    </div>

    <!-- BARRA RÁPIDA: ENTRADA MANUAL Y LINTERNA -->
    <div class="camera-bar">
      <input type="text" id="manualCode" class="input-code" placeholder="Escanear o teclear código..." inputmode="numeric">
      <button id="btnManual" class="btn-action">OK</button>
      <button id="btnTorch" class="btn-action btn-torch" title="Luz / Linterna">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </button>
    </div>

    <!-- TARJETA DEL PRODUCTO DETECTADO -->
    <div id="resultCard" class="result-card">
      <div class="card-top-row">
        <span id="apiSourceBadge" class="api-badge">Buscando...</span>
        <span id="statusPill" class="status-pill">-</span>
      </div>

      <div style="display:flex; gap:12px; align-items:flex-start;">
        <img id="prodImage" alt="" style="display:none; width:64px; height:64px; object-fit:contain; border-radius:8px; border:1px solid var(--border); background:#fff; flex-shrink:0;">
        <div style="flex:1; min-width:0;">
          <div id="prodTitle" class="prod-title">Producto</div>
          <div id="prodCode" class="prod-code">Código: -</div>
          <div id="prodMeta" class="prod-meta-info">-</div>
          <div id="prodPrice" class="price-tag">Precio: $0.00</div>
        </div>
      </div>

      <!-- CAMPOS EDITABLES PARA AGREGAR AL INVENTARIO -->
      <div id="invFields" class="inv-fields">
        <div class="edit-field">
          <label for="editName">Nombre del producto</label>
          <input type="text" id="editName" class="edit-input">
        </div>

        <div class="edit-two-cols">
          <div class="edit-field">
            <label for="editPrice">Precio venta $</label>
            <input type="number" id="editPrice" class="edit-input" step="0.50" min="0" inputmode="decimal">
          </div>
          <div class="edit-field">
            <label for="editCost">Costo $</label>
            <input type="number" id="editCost" class="edit-input" step="0.50" min="0" inputmode="decimal">
          </div>
        </div>

        <div class="inv-row">
          <span class="inv-label">Piezas a agregar:</span>
          <div class="qty-controls">
            <button id="btnQtyMinus" class="btn-qty">-</button>
            <input type="number" id="inputQty" class="qty-display" value="1" min="1" inputmode="numeric">
            <button id="btnQtyPlus" class="btn-qty">+</button>
          </div>
        </div>

        <button id="btnSaveInventory" class="btn-save-inv">
          Guardar en Inventario
        </button>
      </div>
    </div>

    <!-- ESTADO LAN CON EL POS -->
    <div class="lan-info">
      <span id="lanDot" class="lan-dot"></span>
      <span id="lanText">Conectado al Punto de Venta</span>
    </div>

  </div>

  <!-- SCRIPTS LOCALES -->
  <script src="js/lib/html5-qrcode.min.js"></script>
  <script src="js/mexicoBarcodes.js"></script>
  <script src="js/scannerApp.js"></script>
</body>
</html>
